name: CFPreferredIP
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
targets:
  CFPreferredIP:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    info:
      path: CFPreferredIP/Info.plist
    sources:
      - path: CFPreferredIP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trainstone.CFPreferredIP
        PRODUCT_NAME: CFPreferredIP
        INFOPLIST_KEY_CFBundleDisplayName: CFPreferredIP
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    schemes:
      CFPreferredIP:
        build:
          targets:
            CFPreferredIP: all
        run:
          config: Debug
        archive:
          config: Release
