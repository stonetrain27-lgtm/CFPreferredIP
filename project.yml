name: IPFlow
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
targets:
  CFPreferredIP:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    info:
      path: CFPreferredIP/Info.plist
      properties:
        CFBundleDisplayName: IPFlow
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "50"
        UIBackgroundModes:
          - processing
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.trainstone.CFPreferredIP.processing
          - com.trainstone.CFPreferredIP.refresh
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - framework: Frameworks/Fingerprint.xcframework
        embed: true
    sources:
      - path: CFPreferredIP
      - path: worker/subscription/worker.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trainstone.CFPreferredIP
        PRODUCT_NAME: IPFlow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: IPFlow
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
schemes:
  IPFlow:
    build:
      targets:
        CFPreferredIP: all
    run:
      config: Debug
    archive:
      config: Release
