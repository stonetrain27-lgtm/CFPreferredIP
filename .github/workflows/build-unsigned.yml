name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build fingerprint framework
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          cd fingerprint
          gomobile bind -target=ios -o ../Frameworks/Fingerprint.xcframework .
          cd ..
          ls -la Frameworks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen --version
          ls -la
          cat project.yml
          xcodegen generate --spec project.yml

      - name: Archive iOS app
        run: |
          xcodebuild archive \
            -project IPFlow.xcodeproj \
            -scheme IPFlow \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/IPFlow.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          rm -rf Payload IPFlow-unsigned.ipa
          mkdir Payload
          cp -R "$RUNNER_TEMP/IPFlow.xcarchive/Products/Applications/IPFlow.app" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload IPFlow-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFPreferredIP-unsigned-ipa
          path: IPFlow-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
